<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogs — Md. Tawhidul Islam Shifat</title>
<meta property="og:title" content="Blogs — Md. Tawhidul Islam Shifat">
<meta property="og:description" content="খুদ্র চিন্তার জগৎ — ছোট ছোট লেখা, মাঝে মাঝে।">
<meta property="og:type" content="website">
<script>try{var t=localStorage.getItem('shifat-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@300;400&family=Roboto+Mono:wght@400&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151412; --surface:#1D1B18;
  --ink:#F1EEE6; --muted:rgba(241,238,230,.62); --faint:rgba(241,238,230,.38);
  --line:rgba(241,238,230,.14);
  --accent:#E2B45A; --accent-ink:#221A08;
  --f-head:"Poppins",sans-serif; --f-body:"Roboto",sans-serif;
  --f-mono:"Roboto Mono",monospace; --f-bn:"Noto Serif Bengali",serif;
}
[data-theme="light"]{
  --bg:#F4F1E9; --surface:#FCFAF4;
  --ink:#1D1B17; --muted:rgba(29,27,23,.62); --faint:rgba(29,27,23,.4);
  --line:rgba(29,27,23,.15);
  --accent:#9A7118; --accent-ink:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);line-height:1.75}
::selection{background:var(--accent);color:var(--accent-ink)}
img{max-width:100%;display:block}a{color:inherit}button{font-family:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
.wrap{width:min(1200px,100% - clamp(2rem,6vw,5rem));margin-inline:auto}
/* বার */
.bar{position:sticky;top:0;z-index:100;background:rgba(21,20,18,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
[data-theme="light"] .bar{background:rgba(244,241,233,.92)}
.bar-in{display:flex;align-items:center;justify-content:space-between;padding:.85rem 0;gap:1rem}
.logo{font-family:var(--f-head);font-weight:600;font-size:1.3rem;letter-spacing:-.03em;text-decoration:none;flex:none}
.logo .dot{color:var(--accent)}
.bar-links{display:flex;gap:1.6rem;list-style:none}
.bar-links a{font-family:var(--f-head);font-weight:500;font-size:.9rem;color:var(--muted);text-decoration:none;transition:.3s}
.bar-links a:hover{color:var(--ink)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s;flex:none}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
[data-theme="dark"] .icon-sun{display:none}
[data-theme="light"] .icon-moon{display:none}
/* তালিকা পেজ */
.feat{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:16/7;cursor:pointer;border:1px solid var(--line);margin-top:2rem}
.feat img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.feat:hover img{transform:scale(1.03)}
.feat-ol{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,7,.15) 30%,rgba(10,9,7,.88));display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(1.2rem,4vw,2.4rem);gap:.35rem}
.feat-ol .mono{color:var(--accent)}
.feat-ol h2{font-family:var(--f-bn);font-weight:700;color:#fff;font-size:clamp(1.4rem,3.6vw,2.4rem);line-height:1.4;max-width:24ch}
.feat-ol .ex{color:rgba(241,238,230,.75);font-family:var(--f-bn);font-size:.98rem;max-width:60ch}
.layout{display:grid;grid-template-columns:1fr 320px;gap:clamp(2rem,4vw,3.5rem);align-items:start;margin-top:clamp(2.5rem,6vh,4rem);padding-bottom:6rem}
.sec-h{font-family:var(--f-bn);font-weight:700;font-size:clamp(1.5rem,3vw,2rem);border-bottom:2px solid var(--accent);display:inline-block;padding-bottom:.35rem;margin-bottom:1.6rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.19,1,.22,1),border-color .3s;position:relative}
.pcard:hover{transform:translateY(-5px);border-color:var(--accent)}
.pimg{aspect-ratio:16/10;overflow:hidden;background:rgba(241,238,230,.04)}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover .pimg img{transform:scale(1.05)}
.pbody{padding:1.1rem 1.2rem 1.3rem}
.pbody .mono{color:var(--accent);display:block;margin-bottom:.45rem}
.ptitle{font-family:var(--f-bn);font-weight:600;font-size:1.12rem;line-height:1.55}
.pex{color:var(--muted);font-weight:300;font-size:.9rem;margin-top:.45rem;font-family:var(--f-bn);display:block}
.empty{border:1px dashed var(--line);border-radius:6px;padding:2.5rem;text-align:center;color:var(--faint);font-family:var(--f-bn);grid-column:1/-1}
.morewrap{text-align:center;margin-top:2.2rem}
.morebtn{display:inline-flex;align-items:center;gap:.5rem;background:none;border:1px solid var(--ink);border-radius:4px;padding:.75rem 2rem;font-family:var(--f-head);font-weight:500;font-size:.92rem;cursor:pointer;transition:.3s}
.morebtn:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* সাইডবার (কমন) */
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:2rem}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.4rem}
.sbox h3{font-family:var(--f-bn);font-weight:700;font-size:1.05rem;border-bottom:2px solid var(--accent);display:inline-block;padding-bottom:.3rem;margin-bottom:1rem}
.srch{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.srch input{flex:1;background:transparent;border:none;padding:.65rem .8rem;color:var(--ink);font-family:var(--f-bn);font-size:.95rem;min-width:0}
.srch input:focus{outline:none}
.srch button{background:var(--accent);color:var(--accent-ink);border:none;padding:0 .9rem;cursor:pointer}
.slist{list-style:none}
.slist a{display:flex;gap:.8rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line);text-decoration:none;transition:.25s}
.slist li:last-child a{border-bottom:none}
.slist a:hover{padding-left:.4rem;color:var(--accent)}
.slist img{width:58px;height:44px;object-fit:cover;border-radius:4px;flex:none}
.slist .t{font-family:var(--f-bn);font-weight:600;font-size:.9rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.soc{display:flex;gap:.6rem;flex-wrap:wrap}
.soc a{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:600;font-size:.85rem;text-decoration:none;transition:.3s}
.soc a:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.squote{border-left:3px solid var(--accent);padding:.2rem 0 .2rem 1.1rem;font-family:var(--f-bn);font-style:italic;color:var(--muted);font-size:.98rem;line-height:1.9}
/* ══ একক পোস্ট — রেফারেন্স স্টাইল ══ */
.alayout{display:grid;grid-template-columns:300px 1fr;gap:clamp(2rem,4vw,3.5rem);align-items:start;margin-top:2.5rem;padding-bottom:6rem}
.a-side{position:sticky;top:84px;display:flex;flex-direction:column;gap:1.6rem}
.acard{text-align:center;padding:1.8rem 1.4rem}
.ava{width:84px;height:84px;border-radius:50%;margin:0 auto 1rem;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:700;font-size:1.7rem;letter-spacing:.02em}
.acard .nm{font-family:var(--f-bn);font-weight:700;font-size:1.12rem;line-height:1.5}
.acard .rl{color:var(--accent);font-size:.8rem;margin:.2rem 0 .8rem;display:block}
.acard .bio{color:var(--muted);font-family:var(--f-bn);font-size:.92rem;line-height:1.9;font-weight:300}
.acard .all{display:inline-block;margin-top:1rem;font-family:var(--f-head);font-weight:500;font-size:.85rem;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:.15rem}
/* শেয়ার রো — লেখার শুরুতে */
.share-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-bottom:1.2rem;border-bottom:1px solid var(--line);margin-bottom:1.8rem}
.share-top .icons{display:flex;gap:.55rem;flex-wrap:wrap}
.shb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;transition:.3s;cursor:pointer;color:var(--ink)}
.shb:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.a-date{color:var(--muted);font-size:.9rem;white-space:nowrap}
.article h1{font-family:var(--f-bn);font-weight:700;font-size:clamp(1.8rem,4.5vw,2.7rem);line-height:1.45;margin-bottom:1.6rem}
.a-cover{border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-bottom:2rem}
.a-body{font-family:var(--f-bn);font-size:1.1rem;line-height:2.15}
.a-body p{margin-bottom:1.5rem;text-align:justify}
.a-body blockquote{background:var(--surface);border-left:4px solid var(--accent);padding:1.3rem 1.5rem;margin:0 0 1.7rem;border-radius:0 6px 6px 0;font-style:italic;color:var(--ink);line-height:2}
[data-theme="light"] .a-body blockquote{background:#F7F3E6}
.a-body .ref{color:var(--accent);font-size:.8em;vertical-align:super;padding:0 .15em}
.pending{border:1px dashed var(--line);border-radius:6px;padding:1.5rem;color:var(--faint);font-family:var(--f-bn);text-align:center}
.back{display:inline-flex;align-items:center;gap:.5rem;color:var(--muted);text-decoration:none;font-family:var(--f-head);font-weight:500;font-size:.9rem;margin-bottom:1.6rem;transition:.3s}
.back:hover{color:var(--accent)}
/* মতামত */
.cform{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.6rem;margin-top:2.6rem}
.cform h3{font-family:var(--f-bn);font-weight:700;font-size:1.12rem;margin-bottom:1rem}
.cform input,.cform textarea{width:100%;background:transparent;border:1px solid var(--line);border-radius:4px;padding:.7rem .9rem;color:var(--ink);font-family:var(--f-bn);font-size:1rem;margin-bottom:.9rem}
.cform textarea{min-height:100px;resize:vertical}
.cform input:focus,.cform textarea:focus{outline:none;border-color:var(--accent)}
.cbtn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:.7rem 1.4rem;font-family:var(--f-head);font-weight:500;font-size:.92rem;cursor:pointer}
.calt{display:block;margin-top:.9rem;color:var(--faint);font-size:.85rem;font-family:var(--f-bn)}
.calt a{color:var(--accent)}
/* এডিটর */
.pcard,.feat,.article{position:relative}
.pebtns{position:absolute;top:.5rem;right:.5rem;display:none;gap:.35rem;z-index:5}
body.ed-on .pebtns{display:flex}
.pebtn{width:32px;height:32px;border-radius:6px;border:1px solid rgba(241,238,230,.35);background:rgba(12,11,9,.75);color:#F1EEE6;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:.85rem}
.pebtn:hover{background:#E2B45A;color:#221A08;border-color:#E2B45A}
.toast-wrap{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);z-index:4000;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);padding:.85rem 1.4rem;border-radius:3px;font-family:var(--f-head);font-weight:500;font-size:.92rem;opacity:0;transform:translateY(14px);transition:.4s}
.toast.show{opacity:1;transform:none}
@media(max-width:1000px){
  .layout,.alayout{grid-template-columns:1fr}
  .side,.a-side{position:static}
  .a-side{order:2}
}
@media(max-width:760px){
  .grid{grid-template-columns:1fr}
  .bar-links{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<header class="bar">
  <div class="wrap bar-in">

      <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="root" style="padding-top:2.5rem"></main>
<div class="toast-wrap" id="toastWrap"></div>

<script src="posts.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="editor.js"></script>
<script>
"use strict";
var root=document.getElementById('root');
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function bnDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d||'';}}
function enDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('toastWrap').appendChild(t);requestAnimationFrame(function(){t.classList.add('show');});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},400);},3400);}
document.getElementById('themeBtn').addEventListener('click',function(){var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('shifat-theme',n);}catch(e){}});

var PAGE=6,query='',shown=PAGE;
function pbtns(id){return '<span class="pebtns"><button class="pebtn edit" data-kind="post" data-id="'+id+'">✏️</button><button class="pebtn del" data-kind="post" data-id="'+id+'">🗑</button></span>';}

function card(p){
 var ex=(p.body||'').replace(/\s+/g,' ').trim().slice(0,120);
 return '<a class="pcard" href="blogs.html?p='+encodeURIComponent(p.slug)+'" data-slug="'+p.slug+'">'+
 '<span class="pimg"><img src="'+esc(p.cover)+'" alt="'+esc(p.title)+'" loading="lazy" onerror="this.parentNode.style.display=\'none\'"></span>'+
 '<span class="pbody"><span class="mono">'+enDate(p.date)+'</span><span class="ptitle">'+esc(p.title)+'</span>'+
 (ex?'<span class="pex">'+esc(ex)+'…</span>':'')+'</span>'+pbtns(p.slug)+'</a>';
}
function sidebarHTML(posts){
 var recent=posts.slice(0,5).map(function(p){
  return '<li><a href="blogs.html?p='+encodeURIComponent(p.slug)+'">'+
  '<img src="'+esc(p.cover)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'+
  '<span class="t">'+esc(p.title)+'</span></a></li>';
 }).join('');
 return '<aside class="side">'+
 '<div class="sbox"><h3>খুঁজুন</h3>'+
 '<form class="srch" id="srchForm"><input id="srchIn" placeholder="লেখা খুঁজুন…" value="'+esc(query)+'"><button type="submit" aria-label="Search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button></form></div>'+
 '<div class="sbox"><h3>সাম্প্রতিক</h3><ul class="slist">'+(recent||'<li style="color:var(--faint);font-family:var(--f-bn);font-size:.9rem">এখনো লেখা নেই</li>')+'</ul></div>'+
 '<div class="sbox"><h3>বিভাগ</h3><ul class="slist" style="list-style:none">'+
 '<li><a href="blogs.html"><span class="t">সব লেখা</span><span class="t" style="color:var(--faint)">'+posts.length+'</span></a></li>'+
 '<li><a href="index.html#travel"><span class="t">ভ্রমণ</span><span class="t" style="color:var(--faint)">→</span></a></li>'+
 '<li><a href="index.html#hubijabi"><span class="t">হাবিজাবি</span><span class="t" style="color:var(--faint)">→</span></a></li>'+
 '</ul></div>'+
 '<div class="sbox"><h3>অনুসরণ</h3><div class="soc">'+
 '<a href="https://www.facebook.com/tawhidshifat.i" target="_blank" rel="noopener" title="Facebook">f</a>'+
 '<a href="https://twitter.com/tawhid_shifat" target="_blank" rel="noopener" title="X">𝕏</a>'+
 '<a href="https://www.linkedin.com/in/mdtawhidul" target="_blank" rel="noopener" title="LinkedIn">in</a>'+
 '<a href="https://www.youtube.com/@TawhidulIslamShifatOfficial" target="_blank" rel="noopener" title="YouTube">▶</a>'+
 '</div></div>'+
 '<div class="squote">"চিন্তার ঊর্দ্ধে গিয়ে কেউ কখনোই জীবনের নৌকা তীরে ভেড়ায় নাহ।"</div>'+
 '</aside>';
}
/* লেখার রেন্ডার — ">" দিয়ে শুরু হলে উক্তি-বক্স */
function bodyHTML(raw){
 var blocks=(raw||'').split(/\n\s*\n/).filter(function(x){return x.trim();});
 if(!blocks.length)return '<div class="pending">লেখাটি প্রস্তুত হচ্ছে — খুব শীগ্রই এখানে যুক্ত হবে ইনশাআল্লাহ।</div>';
 var out='',q=[];
 function flushQ(){if(q.length){out+='<blockquote>'+q.map(function(t){return esc(t).replace(/\n/g,'<br>');}).join('<br>')+'</blockquote>';q=[];}}
 blocks.forEach(function(b){
  var t=b.trim();
  if(t.charAt(0)==='>'){
   t.split('\n').forEach(function(line){var l=line.replace(/^\s*>\s?/,'');if(l.trim())q.push(l);});
  }else{flushQ();out+='<p>'+esc(t).replace(/\n/g,'<br>')+'</p>';}
 });
 flushQ();
 return out;
}
function render(){
 var all=window.ShifatEditor.posts||[];
 var slug=new URLSearchParams(location.search).get('p');
 if(slug){
  var p=null;for(var i=0;i<all.length;i++){if(all[i].slug===slug){p=all[i];break;}}
  if(!p){root.innerHTML='<div class="empty" style="max-width:640px;margin:2rem auto">Post not found. <a href="blogs.html" style="color:var(--accent)">← Back</a></div>';return;}
  document.title=p.title+' — Md. Tawhidul Islam Shifat';
  var u=location.origin+'/api/post?p='+encodeURIComponent(slug);
  root.innerHTML='<div class="alayout">'+
  '<aside class="a-side">'+
  '<div class="sbox acard"><div class="ava">TS</div>'+
  '<div class="nm">Md. Tawhidul<br>Islam Shifat</div>'+
  '<span class="rl">লেখক</span>'+
  '<p class="bio">পোস্টগ্র্যাজুয়েট ছাত্র (IIUC), গবেষণা-অনুরাগী, লেখক ও প্রাক্তন বক্তা। ছোট ছোট চিন্তা এখানে খাতায় তোলে।</p>'+
  '<a class="all" href="blogs.html">সব লেখা দেখুন →</a></div>'+
  '<div class="sbox"><h3>সাম্প্রতিক</h3><ul class="slist">'+
  all.filter(function(x){return x.slug!==slug;}).slice(0,4).map(function(x){
   return '<li><a href="blogs.html?p='+encodeURIComponent(x.slug)+'"><img src="'+esc(x.cover)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"><span class="t">'+esc(x.title)+'</span></a></li>';
  }).join('')+'</ul></div>'+
  '</aside>'+
  '<article class="article">'+pbtns(p.slug)+
  '<a class="back" href="blogs.html">← সব লেখা</a>'+
  '<div class="share-top">'+
  '<span class="icons">'+
  '<a class="shb" target="_blank" rel="noopener" title="Facebook" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u)+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7h2.4l.4-3h-2.8V9.1c0-.9.3-1.5 1.6-1.5H16V5c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.1H7.5v3h2.3v7h3.7z"/></svg></a>'+
  '<a class="shb" target="_blank" rel="noopener" title="X" href="https://twitter.com/intent/tweet?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(p.title)+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.2l7.3-8.3L1 2h6.5l4.4 5.8L18.9 2zm-1.1 18h1.7L7.6 3.9H5.8L17.8 20z"/></svg></a>'+
  '<a class="shb" target="_blank" rel="noopener" title="WhatsApp" href="https://wa.me/?text='+encodeURIComponent(p.title+' — '+u)+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.7.8-.8 1-.1.2-.3.2-.5.1-.3-.1-1.1-.4-2-1.2-.8-.7-1.3-1.5-1.4-1.8-.1-.3 0-.4.1-.5l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.3 0-.5l-.8-1.8c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg></a>'+
  '<a class="shb" target="_blank" rel="noopener" title="Telegram" href="https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(p.title)+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.6 19 19.3c-.2 1-.8 1.2-1.6.8l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.9.4l.3-4.6L18.6 7c.4-.3-.1-.5-.6-.2L7.7 13.3l-4.4-1.4c-1-.3-1-1 .2-1.4l17.1-6.6c.8-.3 1.5.2 1.3 1.7z"/></svg></a>'+
  '<a class="shb" title="Email" href="mailto:?subject='+encodeURIComponent(p.title)+'&body='+encodeURIComponent(u)+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></a>'+
  '<button class="shb" id="cpL" title="লিংক কপি"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>'+
  '</span>'+
  '<span class="a-date">প্রকাশিত: '+bnDate(p.date)+'</span></div>'+
  '<h1>'+esc(p.title)+'</h1>'+
  (p.cover?'<div class="a-cover"><img src="'+esc(p.cover)+'" alt=""></div>':'')+
  '<div class="a-body">'+bodyHTML(p.body)+'</div>'+
  '<div class="cform"><h3>লিখাটি আপনার কেমন লাগ্লো? মতামত দিন।</h3>'+
  '<input id="cfName" placeholder="আপনার নাম"><textarea id="cfMsg" placeholder="আপনার মতামত…"></textarea>'+
  '<button class="cbtn" id="cfSend">মতামত পাঠান</button>'+
  '<span class="calt">অথবা <a href="mailto:shifat.iiuc@gmail.com?subject='+encodeURIComponent('মতামত: '+p.title)+'">ইমেইল অ্যাপ দিয়ে পাঠান</a></span></div>'+
  '</article></div>';
  document.getElementById('cpL').addEventListener('click',function(){if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){toast('লিংক কপি হয়েছে ✔');},function(){toast('কপি করা গেল না');});});
  document.getElementById('cfSend').addEventListener('click',async function(){
   var nm=document.getElementById('cfName').value.trim(),msg=document.getElementById('cfMsg').value.trim();
   if(!nm||!msg){toast('নাম ও মতামত দুটোই দিন');return;}
   var ok=false;
   if(window.ShifatSB){try{var r=await window.ShifatSB.from('feedback').insert({name:nm,page:p.title,message:msg});ok=!r.error;}catch(e){}}
   if(typeof WEB3FORMS_KEY!=='undefined'&&WEB3FORMS_KEY){
    try{var w=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:'নতুন মতামত — '+p.title,message:'নাম: '+nm+'\nলেখা: '+p.title+'\n\n'+msg})});if(w.ok)ok=true;}catch(e){}
   }
   if(ok){document.getElementById('cfMsg').value='';toast('মতামত পৌঁছে গেছে, ধন্যবাদ! 💛');}
   else toast('ইমেইল অ্যাপ দিয়ে পাঠান — নিচের লিংকে');
  });
 } else {
  var list=filtered(all);
  var feat=list[0];
  var rest=query?list.slice(0,shown):list.slice(1,shown);
  var grid=rest.map(card).join('')||'<div class="empty">'+(query?'"'+esc(query)+'" — এই শব্দে কোনো লেখা মেলেনি।':'এখনো কোনো লেখা নেই — প্রথম লেখাটি খুব শীগ্রই আসছে।')+'</div>';
  var featHTML='';
  if(feat&&!query){
   var fex=(feat.body||'').replace(/\s+/g,' ').trim().slice(0,150);
   featHTML='<a class="feat" href="blogs.html?p='+encodeURIComponent(feat.slug)+'" data-slug="'+feat.slug+'">'+
   '<img src="'+esc(feat.cover)+'" alt="'+esc(feat.title)+'" onerror="this.style.display=\'none\'">'+
   '<span class="feat-ol"><span class="mono">সাম্প্রতিকতম · '+enDate(feat.date)+'</span>'+
   '<h2>'+esc(feat.title)+'</h2>'+(fex?'<span class="ex">'+esc(fex)+'…</span>':'')+'</span>'+pbtns(feat.slug)+'</a>';
  }
  var more=(!query&&list.length>shown)?'<div class="morewrap"><button class="morebtn" id="moreBtn">আরও দেখুন</button></div>':'';
  root.innerHTML=featHTML+
  '<div class="layout"><div><h2 class="sec-h">'+(query?'খোঁজের ফল':'সাম্প্রতিক লেখা')+'</h2>'+
  '<div class="grid">'+grid+'</div>'+more+'</div>'+sidebarHTML(all)+'</div>';
  var mb=document.getElementById('moreBtn');
  if(mb)mb.addEventListener('click',function(){shown+=PAGE;render();});
  bindSrch(all);
 }
}
function filtered(posts){
 if(!query)return posts;
 var q=query.toLowerCase();
 return posts.filter(function(p){return (p.title+' '+(p.body||'')).toLowerCase().indexOf(q)>-1;});
}
function bindSrch(all){
 var f=document.getElementById('srchForm');if(!f)return;
 f.addEventListener('submit',function(e){
  e.preventDefault();
  query=document.getElementById('srchIn').value.trim();
  shown=PAGE;render();
 });
}
window.ShifatEditor.onChange=render;
window.ShifatEditor.init();
</script>
