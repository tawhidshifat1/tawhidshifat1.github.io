<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogs — Md. Tawhidul Islam Shifat</title>
<script>
try{var t=localStorage.getItem('shifat-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@300;400&family=Roboto+Mono:wght@400&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151412; --surface:#1D1B18;
  --ink:#F1EEE6; --muted:rgba(241,238,230,.62); --faint:rgba(241,238,230,.38);
  --line:rgba(241,238,230,.14);
  --accent:#E2B45A; --accent-ink:#221A08;
  --f-head:"Poppins",sans-serif; --f-body:"Roboto",sans-serif;
  --f-mono:"Roboto Mono",monospace; --f-bn:"Noto Serif Bengali",serif;
}
[data-theme="light"]{
  --bg:#F4F1E9; --surface:#FCFAF4;
  --ink:#1D1B17; --muted:rgba(29,27,23,.62); --faint:rgba(29,27,23,.4);
  --line:rgba(29,27,23,.15);
  --accent:#9A7118; --accent-ink:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);line-height:1.75}
::selection{background:var(--accent);color:var(--accent-ink)}
img{max-width:100%;display:block}
a{color:inherit}
button{font-family:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase}
.wrap{width:min(1080px,100% - clamp(2.4rem,7vw,6rem));margin-inline:auto}
.bar{position:sticky;top:0;z-index:100;background:rgba(21,20,18,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
[data-theme="light"] .bar{background:rgba(244,241,233,.86)}
.bar-in{display:flex;align-items:center;justify-content:space-between;padding:1rem 0}
.logo{font-family:var(--f-head);font-weight:600;font-size:1.25rem;letter-spacing:-.03em;text-decoration:none}
.logo .dot{color:var(--accent)}
.bar-right{display:flex;align-items:center;gap:.9rem}
.bar-link{font-family:var(--f-head);font-weight:500;font-size:.9rem;color:var(--muted);text-decoration:none;transition:.3s}
.bar-link:hover{color:var(--ink)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;transition:.3s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
[data-theme="dark"] .icon-sun{display:none}
[data-theme="light"] .icon-moon{display:none}
.page{padding:3.2rem 0 6rem}
.page-head{margin-bottom:2.6rem}
.page-head h1{font-family:var(--f-bn);font-weight:600;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.02em}
.page-head p{color:var(--muted);font-weight:300;margin-top:.4rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.post{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .4s cubic-bezier(.19,1,.22,1),border-color .3s}
.post:hover{transform:translateY(-6px);border-color:var(--accent)}
.post-img{aspect-ratio:16/10;overflow:hidden}
.post-img img{width:100%;height:100%;object-fit:cover}
.post-body{padding:1.2rem 1.3rem 1.4rem}
.post-body .mono{color:var(--accent);display:block;margin-bottom:.5rem}
.post-title{font-family:var(--f-bn);font-weight:600;font-size:1.15rem;line-height:1.5}
.post-ex{color:var(--muted);font-weight:300;font-size:.92rem;margin-top:.5rem;font-family:var(--f-bn);display:block}
.empty{border:1px dashed var(--line);border-radius:4px;padding:2.5rem;text-align:center;color:var(--faint)}
.article{max-width:720px;margin-inline:auto}
.back{display:inline-flex;align-items:center;gap:.5rem;color:var(--muted);text-decoration:none;font-family:var(--f-head);font-weight:500;font-size:.92rem;margin-bottom:2rem;transition:.3s}
.back:hover{color:var(--accent)}
.article .a-date{color:var(--accent);margin-bottom:.8rem;display:block}
.article h1{font-family:var(--f-bn);font-weight:600;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.4;margin-bottom:1.6rem}
.a-cover{border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-bottom:2rem}
.a-body{font-family:var(--f-bn);font-size:1.12rem;line-height:2.1}
.a-body p{margin-bottom:1.4rem}
.a-body p:first-child::first-letter{font-size:1.5em;font-weight:600;color:var(--accent)}
.pending{border:1px dashed var(--line);border-radius:4px;padding:1.5rem;color:var(--faint);font-family:var(--f-bn);text-align:center}
.toast-wrap{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);z-index:4000;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:.7rem;background:var(--ink);color:var(--bg);padding:.85rem 1.4rem;border-radius:3px;font-family:var(--f-head);font-weight:500;font-size:.92rem;opacity:0;transform:translateY(14px);transition:.4s;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:none}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap bar-in">
    <a class="logo" href="index.html">Shifat<span class="dot">.</span></a>
    <div class="bar-right">
      <a class="bar-link" href="index.html">← Home</a>
      <a class="bar-link" href="resume.html">Resume</a>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap page" id="root"></main>
<div class="toast-wrap" id="toastWrap"></div>

<script src="posts.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="editor.js"></script>
<script>
"use strict";
var root = document.getElementById('root');
function fmtDate(d){
  try{ return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
  catch(e){ return d; }
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('shifat-theme', next); }catch(e){}
});

function pbtns(slug){
  return '<span class="pebtns">' +
    '<button class="pebtn edit" title="Edit post" aria-label="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>' +
    '<button class="pebtn del" title="Delete post" aria-label="Delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>' +
  '</span>';
}

function render(){
  var posts = ShifatEditor.posts || [];
  var slug = new URLSearchParams(location.search).get('p');

  if (slug){
    var p = null;
    for (var i=0;i<posts.length;i++){ if (posts[i].slug === slug){ p = posts[i]; break; } }
    if (!p){
      root.innerHTML = '<div class="empty">Post not found. <a href="blogs.html" style="color:var(--accent)">← Back to blogs</a></div>';
      return;
    }
    document.title = p.title + ' — Md. Tawhidul Islam Shifat';
    var paras = (p.body||'').split(/\n\s*\n/).filter(function(x){ return x.trim(); });
    var html = '<article class="article">' +
      '<a class="back" href="blogs.html">← All blogs</a>' +
      '<span class="a-date mono">' + fmtDate(p.date) + '</span>' +
      '<h1>' + esc(p.title) + '</h1>' +
      (p.cover ? '<div class="a-cover"><img src="' + p.cover + '" alt="' + esc(p.title) + '"></div>' : '') +
      '<div class="a-body">';
    if (paras.length){
      html += paras.map(function(t){ return '<p>' + esc(t.trim()).replace(/\n/g,'<br>') + '</p>'; }).join('');
    } else {
      html += '<div class="pending">লেখাটি প্রস্তুত হচ্ছে — খুব শীগ্রই এখানে যুক্ত হবে ইনশাআল্লাহ।</div>';
    }
    html += '</div><div style="margin-top:3rem"><a class="back" href="blogs.html">← All blogs</a></div></article>';
    root.innerHTML = html;
  } else {
    var listHtml = posts.length
      ? '<div class="grid">' + posts.map(function(p){
          var ex = (p.body||'').replace(/\s+/g,' ').trim().slice(0,110);
          return '<a class="post" href="blogs.html?p=' + encodeURIComponent(p.slug) + '" data-slug="' + p.slug + '">' +
            '<span class="post-img"><img src="' + (p.cover||'') + '" alt="' + esc(p.title) + '" loading="lazy" onerror="this.style.display=\'none\'"></span>' +
            '<span class="post-body"><span class="mono">' + fmtDate(p.date) + '</span><span class="post-title">' + esc(p.title) + '</span>' +
            (ex ? '<span class="post-ex">' + esc(ex) + '…</span>' : '') + '</span>' + pbtns(p.slug) + '</a>';
        }).join('') + '</div>'
      : '<div class="empty">No posts yet — প্রথম লেখাটি খুব শীগ্রই আসছে।</div>';
    root.innerHTML = '<div class="page-head"><h1>My Blogs</h1><p>খুদ্র চিন্তার জগৎ — ছোট ছোট লেখা, মাঝে মাঝে।</p></div>' + listHtml;
  }
}
ShifatEditor.onChange = render;
ShifatEditor.init();
</script>
</body>
</html>
