<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogs — Md. Tawhidul Islam Shifat</title>
<meta property="og:title" content="Blogs — Md. Tawhidul Islam Shifat">
<meta property="og:description" content="খুদ্র চিন্তার জগৎ — ছোট ছোট লেখা, মাঝে মাঝে।">
<meta property="og:type" content="website">
<script>try{var t=localStorage.getItem('shifat-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@300;400&family=Roboto+Mono:wght@400&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#151412;--surface:#1D1B18;--ink:#F1EEE6;--muted:rgba(241,238,230,.62);--faint:rgba(241,238,230,.38);--line:rgba(241,238,230,.14);--accent:#E2B45A;--accent-ink:#221A08;--f-head:"Poppins",sans-serif;--f-body:"Roboto",sans-serif;--f-mono:"Roboto Mono",monospace;--f-bn:"Noto Serif Bengali",serif}
[data-theme="light"]{--bg:#F4F1E9;--surface:#FCFAF4;--ink:#1D1B17;--muted:rgba(29,27,23,.62);--faint:rgba(29,27,23,.4);--line:rgba(29,27,23,.15);--accent:#9A7118;--accent-ink:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);line-height:1.75}
::selection{background:var(--accent);color:var(--accent-ink)}
img{max-width:100%;display:block}a{color:inherit}button{font-family:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase}
.wrap{width:min(1080px,100% - clamp(2.4rem,7vw,6rem));margin-inline:auto}
.bar{position:sticky;top:0;z-index:100;background:rgba(21,20,18,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
[data-theme="light"] .bar{background:rgba(244,241,233,.86)}
.bar-in{display:flex;align-items:center;justify-content:space-between;padding:1rem 0}
.logo{font-family:var(--f-head);font-weight:600;font-size:1.25rem;letter-spacing:-.03em;text-decoration:none}.logo .dot{color:var(--accent)}
.bar-right{display:flex;align-items:center;gap:.9rem}
.bar-link{font-family:var(--f-head);font-weight:500;font-size:.9rem;color:var(--muted);text-decoration:none}.bar-link:hover{color:var(--ink)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
[data-theme="dark"] .icon-sun{display:none}[data-theme="light"] .icon-moon{display:none}
.page{padding:3.2rem 0 6rem}
.page-head{margin-bottom:2.6rem}
.page-head h1{font-family:var(--f-bn);font-weight:600;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.02em}
.page-head p{color:var(--muted);font-weight:300;margin-top:.4rem;font-family:var(--f-bn)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.post{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .4s cubic-bezier(.19,1,.22,1),border-color .3s}
.post:hover{transform:translateY(-6px);border-color:var(--accent)}
.post-img{aspect-ratio:16/10;overflow:hidden}.post-img img{width:100%;height:100%;object-fit:cover}
.post-body{padding:1.2rem 1.3rem 1.4rem}
.post-body .mono{color:var(--accent);display:block;margin-bottom:.5rem}
.post-title{font-family:var(--f-bn);font-weight:600;font-size:1.15rem;line-height:1.5}
.post-ex{color:var(--muted);font-weight:300;font-size:.92rem;margin-top:.5rem;font-family:var(--f-bn);display:block}
.empty{border:1px dashed var(--line);border-radius:4px;padding:2.5rem;text-align:center;color:var(--faint)}
.article{max-width:720px;margin-inline:auto}
.back{display:inline-flex;align-items:center;gap:.5rem;color:var(--muted);text-decoration:none;font-family:var(--f-head);font-weight:500;font-size:.92rem;margin-bottom:2rem}
.back:hover{color:var(--accent)}
.a-date{color:var(--accent);margin-bottom:.8rem;display:block}
.article h1{font-family:var(--f-bn);font-weight:600;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.4;margin-bottom:1.6rem}
.a-cover{border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-bottom:2rem}
.a-body{font-family:var(--f-bn);font-size:1.12rem;line-height:2.1}
.a-body p{margin-bottom:1.4rem}
.pending{border:1px dashed var(--line);border-radius:4px;padding:1.5rem;color:var(--faint);font-family:var(--f-bn);text-align:center}
.share-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:2.6rem 0;padding-top:1.6rem;border-top:1px solid var(--line)}
.share-row .lbl{font-family:var(--f-head);font-weight:500;font-size:.88rem;color:var(--muted);margin-right:.3rem}
.shb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:600;font-size:.95rem;text-decoration:none;transition:.3s}
.shb:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cform{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.6rem;margin-top:1rem;max-width:640px}
.cform h3{font-family:var(--f-bn);font-weight:600;font-size:1.15rem;margin-bottom:1rem}
.cform input,.cform textarea{width:100%;background:transparent;border:1px solid var(--line);border-radius:4px;padding:.7rem .9rem;color:var(--ink);font-family:var(--f-bn);font-size:1rem;margin-bottom:.9rem}
.cform textarea{min-height:100px;resize:vertical}
.cform input:focus,.cform textarea:focus{outline:none;border-color:var(--accent)}
.cbtn{display:inline-flex;align-items:center;gap:.5rem;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:.7rem 1.4rem;font-family:var(--f-head);font-weight:500;font-size:.92rem;cursor:pointer}
.calt{display:block;margin-top:.9rem;color:var(--faint);font-size:.85rem;font-family:var(--f-bn)}
.calt a{color:var(--accent)}
.toast-wrap{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);z-index:4000;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);padding:.85rem 1.4rem;border-radius:3px;font-family:var(--f-head);font-weight:500;font-size:.92rem;opacity:0;transform:translateY(14px);transition:.4s}
.toast.show{opacity:1;transform:none}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap bar-in">
 <a class="logo" href="index.html">Shifat<span class="dot">.</span></a>
 <div class="bar-right">
  <a class="bar-link" href="index.html">← Home</a><a class="bar-link" href="resume.html">Resume</a>
  <button class="icon-btn" id="themeBtn" aria-label="Theme">
   <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
   <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
 </div>
</div></header>

<main class="wrap page" id="root"></main>
<div class="toast-wrap" id="toastWrap"></div>

<script src="posts.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="editor.js"></script>
<script>
"use strict";
var root=document.getElementById('root');
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
document.getElementById('themeBtn').addEventListener('click',function(){var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('shifat-theme',n);}catch(e){}});
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toastWrap').appendChild(t);requestAnimationFrame(function(){t.classList.add('show');});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},400);},3400);}

function pbtns(slug){return '<span class="pebtns"><button class="pebtn edit" data-kind="post" data-id="'+slug+'">✏️</button><button class="pebtn del" data-kind="post" data-id="'+slug+'">🗑</button></span>';}

function render(){
 var posts=window.ShifatEditor.posts||[];
 var slug=new URLSearchParams(location.search).get('p');
 if(slug){
  var p=null;for(var i=0;i<posts.length;i++){if(posts[i].slug===slug){p=posts[i];break;}}
  if(!p){root.innerHTML='<div class="empty">Post not found. <a href="blogs.html" style="color:var(--accent)">← Back</a></div>';return;}
  document.title=p.title+' — Md. Tawhidul Islam Shifat';
  var u=location.origin+'/api/post?p='+encodeURIComponent(slug);
  var fb='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u);
  var tw='https://twitter.com/intent/tweet?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(p.title);
  var li='https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(u);
  var wa='https://wa.me/?text='+encodeURIComponent(p.title+' — '+u);
  var paras=(p.body||'').split(/\n\s*\n/).filter(function(x){return x.trim();});
  var html='<article class="article"><a class="back" href="blogs.html">← All blogs</a>'+
   '<span class="a-date mono">'+fmtDate(p.date)+'</span><h1>'+esc(p.title)+'</h1>'+
   (p.cover?'<div class="a-cover"><img src="'+esc(p.cover)+'" alt=""></div>':'')+
   '<div class="a-body">'+(paras.length?paras.map(function(t){return '<p>'+esc(t.trim()).replace(/\n/g,'<br>')+'</p>';}).join(''):'<div class="pending">লেখাটি প্রস্তুত হচ্ছে — খুব শীগ্রই এখানে যুক্ত হবে ইনশাআল্লাহ।</div>')+'</div>'+
   '<div class="share-row"><span class="lbl">শেয়ার করুন:</span>'+
   '<a class="shb" href="'+fb+'" target="_blank" rel="noopener" title="Facebook">f</a>'+
   '<a class="shb" href="'+tw+'" target="_blank" rel="noopener" title="X">𝕏</a>'+
   '<a class="shb" href="'+li+'" target="_blank" rel="noopener" title="LinkedIn">in</a>'+
   '<a class="shb" href="'+wa+'" target="_blank" rel="noopener" title="WhatsApp">✆</a>'+
   '<button class="shb" id="cpLink" title="লিংক কপি">🔗</button></div>'+
   '<div class="cform"><h3>লিখাটি আপনার কেমন লাগ্লো? মতামত দিন।</h3>'+
   '<input id="cfName" placeholder="আপনার নাম">'+
   '<textarea id="cfMsg" placeholder="আপনার মতামত…"></textarea>'+
   '<button class="cbtn" id="cfSend">মতামত পাঠান</button>'+
   '<span class="calt">অথবা <a id="cfMail" href="#">ইমেইল অ্যাপ দিয়ে পাঠান</a></span></div>'+
   '<div style="margin-top:3rem"><a class="back" href="blogs.html">← All blogs</a></div></article>';
  root.innerHTML=html;
  document.getElementById('cfMail').href='mailto:shifat.iiuc@gmail.com?subject='+encodeURIComponent('মতামত: '+p.title)+'&body='+encodeURIComponent((document.getElementById('cfName').value?'':''));
  document.getElementById('cpLink').addEventListener('click',function(){
   if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){toast('লিংক কপি হয়েছে ✔');},function(){toast('কপি করা গেল না');});
  });
  document.getElementById('cfSend').addEventListener('click',async function(){
   var nm=document.getElementById('cfName').value.trim();
   var msg=document.getElementById('cfMsg').value.trim();
   if(!nm||!msg){toast('নাম ও মতামত দুটোই দিন');return;}
   var ok=false;
   if(window.ShifatSB){try{var r=await window.ShifatSB.from('feedback').insert({name:nm,page:p.title,message:msg});ok=!r.error;}catch(e){}}
   if(typeof WEB3FORMS_KEY!=='undefined'&&WEB3FORMS_KEY){
    try{var w=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:'নতুন মতামত — '+p.title,from_name:'Portfolio Feedback',
     message:'নাম: '+nm+'\nলেখা: '+p.title+'\n\n'+msg})});if(w.ok)ok=true;}catch(e){}
   }
   if(ok){document.getElementById('cfMsg').value='';toast('মতামত পৌঁছে গেছে, ধন্যবাদ! 💛');}
   else{toast('সরাসরি ইমেইল অ্যাপ দিয়ে পাঠান — নিচের লিংকে');}
  });
 } else {
  var list=posts.length?'<div class="grid">'+posts.map(function(p){
   var ex=(p.body||'').replace(/\s+/g,' ').trim().slice(0,110);
   return '<a class="post" href="blogs.html?p='+encodeURIComponent(p.slug)+'" data-slug="'+p.slug+'">'+
   '<span class="post-img"><img src="'+esc(p.cover)+'" alt="'+esc(p.title)+'" loading="lazy" onerror="this.style.display=\'none\'"></span>'+
   '<span class="post-body"><span class="mono">'+fmtDate(p.date)+'</span><span class="post-title">'+esc(p.title)+'</span>'+
   (ex?'<span class="post-ex">'+esc(ex)+'…</span>':'')+'</span>'+pbtns(p.slug)+'</a>';
  }).join('')+'</div>':'<div class="empty">No posts yet।</div>';
  root.innerHTML='<div class="page-head"><h1>My Blogs</h1><p data-skey="blogs_sub">আমার ক্ষুদ্র চিন্তার জগতে আপনার অবাধ বিচরনকে সাধুবাদ জানাই।</p></div>'+list;
 }
}
window.ShifatEditor.onChange=render;
window.ShifatEditor.init();
</script>
</body>
</html>
